services:
  postgres:
    container_name: ddev-${DDEV_SITENAME}-postgres
    hostname: ${DDEV_SITENAME}-postgres
    image: postgres:17
    environment:
      - POSTGRES_USER=db
      - POSTGRES_PASSWORD=db
      - POSTGRES_DB=db
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5433:5432"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - "postgres:/var/lib/postgresql/data"
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db"]
      interval: 5s
      retries: 10

volumes:
  postgres:
    name: "${DDEV_SITENAME}_postgres"
